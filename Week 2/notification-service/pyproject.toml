[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notification-service"
version = "0.1.0"
description = "A modular notification service demonstrating Python OOP and software design."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "1ACC Week 2"}
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.setuptools.packages.find]
where = ["src"]
